.btn.alt{background:transparent;color:var(--primary);border:1px solid var(--primary);margin-top:10px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-top:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:16px}

.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.12)}
.opt.bad{border-color:var(--bad);background:rgba(220,38,38,.12)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);width:0;transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(79,70,229,.12);color:var(--primary);margin-bottom:10px}
.q{font-size:19px;font-weight:600;line-height:1.45}
.exp{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(79,70,229,.1);font-size:14px}
.big{font-size:48px;font-weight:700;text-align:center;margin:6px 0}
.center{text-align:center}
.wrongitem{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.wrongitem b{color:var(--ok)}
.stats{font-size:13px;color:var(--muted);margin-top:12px}
.hidden{display:none}
</style>

<script>
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ALL = QUESTIONS.map((r, i) => ({ id: i, cat: r[0], q: r[1], correct: r[2], wrong: [r[3], r[4], r[5]], exp: r[6] || '' }));
let list = [], idx = 0, score = 0, wrongs = [], locked = false;

function loadStats() { try { return JSON.parse(localStorage.getItem('e10stats')) || { done: 0, correct: 0, best: 0 }; } catch (e) { return { done: 0, correct: 0, best: 0 }; } }
function saveStats(s) { try { localStorage.setItem('e10stats', JSON.stringify(s)); } catch (e) {} }
function show(id) { ['home', 'quiz', 'result'].forEach(x => $(x).classList.toggle('hidden', x !== id)); window.scrollTo(0, 0); }

function initHome() {
  $('total').textContent = ALL.length;
  const cats = [...new Set(ALL.map(q => q.cat))];
  $('cat').innerHTML = '<option value="">Tất cả chủ đề (' + ALL.length + ')</option>' +
    cats.map(c => '<option value="' + c + '">' + c + ' (' + ALL.filter(q => q.cat === c).length + ')</option>').join('');
  const s = loadStats();
  $('stats').textContent = s.done ? 'Đã làm ' + s.done + ' câu · đúng ' + Math.round(s.correct / s.done * 100) + '% · điểm cao nhất: ' + s.best + '%' : '';
  show('home');
}

function start(pool) {
  list = shuffle(pool); idx = 0; score = 0; wrongs = [];
  show('quiz'); render();
}

function render() {
  const q = list[idx]; locked = false;
  $('pos').textContent = 'Câu ' + (idx + 1) + '/' + list.length;
  $('score').textContent = 'Đúng: ' + score;
  $('prog').style.width = (idx / list.length * 100) + '%';
  $('qcat').textContent = q.cat;
  $('qtext').innerHTML = q.q;
  $('exp').classList.add('hidden'); $('next').classList.add('hidden');
  const opts = shuffle([q.correct, ...q.wrong]);
  $('opts').innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = o;
    b.onclick = () => answer(b, o, q);
    $('opts').appendChild(b);
  });
}

function answer(btn, o, q) {
  if (locked) return; locked = true;
  const right = o === q.correct;
  if (right) score++; else wrongs.push(q);
  [...$('opts').children].forEach(b => { b.disabled = true; if (b.textContent === q.correct) b.classList.add('ok'); });
  if (!right) btn.classList.add('bad');
  $('score').textContent = 'Đúng: ' + score;
  if (q.exp) { $('exp').textContent = '💡 ' + q.exp; $('exp').classList.remove('hidden'); }
  $('next').textContent = idx === list.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo';
  $('next').classList.remove('hidden');
}

function finish() {
  const pct = Math.round(score / list.length * 100);
  const s = loadStats(); s.done += list.length; s.correct += score; s.best = Math.max(s.best, pct); saveStats(s);
  $('rscore').textContent = score + '/' + list.length;
  $('rmsg').textContent = pct + '% — ' + (pct >= 90 ? 'Xuất sắc! 🎉' : pct >= 70 ? 'Khá tốt, cố thêm chút nữa! 👍' : pct >= 50 ? 'Cần ôn thêm 💪' : 'Hãy xem lại kiến thức và thử lại 📚');
  $('retryWrong').classList.toggle('hidden', !wrongs.length);
  $('wrongbox').classList.toggle('hidden', !wrongs.length);
  $('wronglist').innerHTML = wrongs.map(w => '<div class="wrongitem">' + w.q + '<br>→ <b>' + w.correct + '</b>' + (w.exp ? '<br><i>' + w.exp + '</i>' : '') + '</div>').join('');
  show('result');
}

$('start').onclick = () => {
  const c = $('cat').value, n = +$('num').value;
  let pool = ALL.filter(q => !c || q.cat === c);
  if (n && n < pool.length) pool = shuffle(pool).slice(0, n);
  start(pool);
};
$('next').onclick = () => { idx++; idx >= list.length ? finish() : render(); };
$('quit').onclick = () => { if (confirm('Thoát bài làm hiện tại?')) initHome(); };
$('again').onclick = initHome;
$('retryWrong').onclick = () => start(wrongs.slice());
initHome();
</script>
